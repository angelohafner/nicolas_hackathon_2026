/* Standalone enhancement: English edition */
/* Mission Director experience — visual enhancements, accessibility, and audio UI. */
:root {
  --director-cyan:#6bdfff;
  --director-mint:#69f3bd;
  --director-amber:#ffcb81;
  --director-red:#ff817c;
}
button:focus-visible, input:focus-visible, a:focus-visible {
  outline:2px solid #75ddff;
  outline-offset:3px;
}
button { -webkit-tap-highlight-color: transparent; }
.header-voice,.header-sound-settings {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:36px; border:1px solid rgba(112,162,204,.28);
  background:rgba(18,39,67,.72); color:#d8eaff;
  border-radius:8px; padding:8px 10px; font-size:10px;
  letter-spacing:.7px; font-weight:800; white-space:nowrap;
  transition:background .2s,border-color .2s,transform .2s;
}
.header-voice:hover,.header-sound-settings:hover,.listen-inline:hover {
  border-color:rgba(103,222,255,.7);background:rgba(30,70,108,.78);
  transform:translateY(-1px);
}
.header-voice--on {color:#9ff7e2;border-color:rgba(74,238,188,.35);}
.header-sound-settings{width:37px;padding:7px;}
.audio-popover {
  position:absolute;right:max(4.3%,24px);top:70px;z-index:30;
  width:min(355px,calc(100vw - 28px));padding:20px;
  box-shadow:0 16px 65px rgba(0,0,0,.52);
}
.audio-popover>div:first-child {display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.audio-popover strong {font-size:12px;letter-spacing:1.1px;}
.audio-popover>div>span {font-size:10px;color:#9fc1d7;}
.audio-popover label {display:flex;justify-content:space-between;gap:15px;font-size:10px;font-weight:800;letter-spacing:1px;}
.audio-popover input[type=range]{width:100%;accent-color:#63dfff;margin:13px 0 20px;}
.audio-popover .sound-buttons{display:flex;gap:10px;justify-content:space-between;}
.audio-popover .sound-buttons button{font-size:10px;}
.audio-popover small{display:block;color:#a4b7cb;line-height:1.6;margin-top:15px;font-size:10px;}

.interactive-roadmap,.interactive-rule {
  width:100%;font:inherit;color:inherit;text-align:left;
  position:relative;overflow:hidden;cursor:pointer;
  transition:transform .22s,border-color .22s,background .22s,box-shadow .22s;
}
.interactive-roadmap:hover,.interactive-rule:hover{
  transform:translateY(-3px);border-color:rgba(95,209,252,.45);
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}
.interactive-roadmap--active{
  border-color:rgba(103,223,255,.6);
  background:linear-gradient(130deg,rgba(33,79,113,.9),rgba(9,32,58,.87));
  box-shadow:inset 0 0 25px rgba(56,150,202,.09);
}
.interactive-roadmap--active:before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;background:#69e6ff;
  box-shadow:0 0 22px #69e6ff;
}
.interactive-rule--active {border-color:rgba(105,221,255,.56);background:linear-gradient(145deg,rgba(28,58,87,.92),rgba(13,29,52,.96));}
.interactive-rule--active:after{
  content:"";position:absolute;height:3px;left:15px;right:15px;bottom:0;
  background:linear-gradient(90deg,#59d9fb,transparent);
}
.interactive-rule p{white-space:normal;}
.explore-detail{
  display:grid;grid-template-columns:68px 1fr auto;gap:20px;align-items:center;
  padding:19px 22px;margin:1px 0 23px;
  border:1px solid rgba(94,213,240,.25);border-radius:11px;
  background:linear-gradient(108deg,rgba(14,45,75,.92),rgba(8,26,50,.86));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 37px rgba(0,0,0,.09);
  animation:detail-in .22s ease-out;
}
.explore-marker{width:60px;height:62px;border:1px solid rgba(91,208,250,.38);border-radius:9px;
  background:linear-gradient(150deg,rgba(42,107,149,.45),rgba(8,37,66,.72));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9aeaff;}
.explore-marker span{font-family:Consolas,monospace;font-size:10px;letter-spacing:2px;}
.detail-eyebrow,.rule-inspector>div>span{font-family:Consolas,monospace;font-size:9px;letter-spacing:1.7px;color:#76cff0;}
.explore-text h3 {margin:5px 0 7px;font-size:18px;letter-spacing:-.3px;color:#f1f9ff;}
.explore-text p,.rule-inspector p {font-size:11px;line-height:1.65;color:#afc9dd;margin:0;}
.detail-objective{display:flex;align-items:flex-start;gap:8px;margin-top:11px;color:#9ff2d4;font-size:10.5px;line-height:1.5;}
.detail-objective svg{flex-shrink:0;margin-top:1px;}
.listen-inline{display:inline-flex;align-items:center;gap:8px;justify-content:center;
  align-self:center;border:1px solid rgba(112,175,216,.29);background:rgba(17,45,74,.65);
  color:#ccecff;border-radius:8px;min-height:35px;padding:9px 12px;font-size:9px;
  letter-spacing:.8px;font-weight:800;white-space:nowrap;transition:all .2s;}
.rule-inspector{
  display:flex;align-items:center;gap:15px;padding:16px 19px;
  border:1px solid rgba(110,175,221,.23);border-radius:11px;
  margin-top:12px;background:rgba(8,25,46,.83);animation:detail-in .22s ease-out;
}
.inspector-icon{display:grid;place-items:center;flex:0 0 41px;width:41px;height:41px;
  border-radius:9px;background:rgba(68,176,230,.1);border:1px solid rgba(72,205,242,.26);color:#72dcff;}
.inspector-icon--amber{color:#ffd383;border-color:rgba(255,207,120,.33);background:rgba(255,174,66,.08);}
.inspector-icon--mint{color:#8ff3cc;border-color:rgba(126,235,183,.35);background:rgba(57,188,138,.08);}
.inspector-icon--violet{color:#c7b3ff;border-color:rgba(174,145,255,.35);background:rgba(147,103,242,.08);}
.rule-inspector>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.rule-inspector strong{font-size:13px;color:#f1f8ff;}
.rule-inspector small{font-size:10px;color:#91e9c8;margin-top:3px;}
.rule-inspector .listen-inline{width:38px;padding:8px;flex:0 0 auto;}
.preview-next{display:flex;gap:9px;align-items:flex-start;padding:13px 0 0;font-size:10px;line-height:1.5;color:#afd8ec;}
.preview-next svg{flex-shrink:0;}

.diagnostic-rail{margin:18px 0 5px;padding:14px 16px;background:rgba(7,27,49,.75);border-radius:9px;border:1px solid rgba(108,176,219,.17);}
.diagnostic-rail-copy{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px;}
.diagnostic-rail-copy strong{font-size:10px;letter-spacing:1.2px;color:#afeafa;}
.diagnostic-rail-copy span{font-size:10px;color:#9bbcd4;font-family:Consolas,monospace;white-space:nowrap;}
.check-item--scanning{background:linear-gradient(90deg,rgba(51,177,228,.12),transparent);}
.check-item--scanning .check-item-name strong{color:#95e6ff;}
.status-light--pending{border:1px solid #7189a7;background:#22344c;box-shadow:none;}
.status-light--scanning{border:1px solid #8deaff;background:#64dafa;box-shadow:0 0 17px #4bd9ff;animation:scan-pulse .82s ease-in-out infinite;}
.check-item--scanning .check-item-status{color:#b9efff;}
.check-item-status{min-width:0;}
.check-item-status>span:last-child{white-space:nowrap;}
.diagnostic-console{margin-top:19px;padding:0;overflow:hidden;border:1px solid rgba(84,155,201,.27);border-radius:10px;background:rgba(3,13,28,.95);}
.console-head{background:rgba(20,47,75,.86);padding:12px 15px;border-bottom:1px solid rgba(109,158,196,.24);
  display:flex;align-items:center;justify-content:space-between;gap:8px;}
.console-head>span{font-family:Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:1.1px;color:#9be7ff;display:flex;gap:9px;align-items:center;}
.console-head small{font-size:9px;color:#7394aa;letter-spacing:.8px;}
.console-pulse{height:7px;width:7px;background:#74edb5;box-shadow:0 0 14px rgba(112,255,202,.63);border-radius:50%;animation:scan-pulse 1.4s infinite;}
.console-lines{padding:12px 16px;min-height:145px;max-height:226px;overflow:auto;scrollbar-color:#375c7c transparent;}
.console-line{display:flex;gap:10px;font:10px/1.6 Consolas,'Courier New',monospace;color:#9ab9cb;margin:0 0 5px;}
.console-line>span:first-child{color:#50799b;flex:0 0 auto;}
.console-line strong{color:#78bddf;flex:0 0 auto;}
.console-line>span:last-child{flex:1;}
.console-line--good>span:last-child{color:#8cf1c4;}
.console-line--warn>span:last-child{color:#ffcf87;}
.console-line--bad>span:last-child{color:#ff9c9a;}
.console-empty{font:11px/1.65 Consolas,monospace;color:#7292ac;padding:9px 0;}
.launch-panel{position:relative;overflow:hidden;}
.launch-panel:after{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(93,220,255,.57),transparent);}
.launch-panel .button--launch{font-size:10px;letter-spacing:1px;padding:15px 10px;margin-top:11px;}
.launch-panel .button--launch svg{flex-shrink:0;}
.launch-panel-caption{font-size:10.5px;line-height:1.55;}
.mission-director-tag{display:flex;justify-content:center;align-items:center;gap:9px;margin:17px auto 0;
  color:#759db7;font-size:9px;letter-spacing:.9px;}
.mission-director-tag b{color:#bde8ef;}
.countdown-stage{border:1px solid rgba(108,221,248,.37);border-radius:11px;padding:24px 16px 18px;
  background:radial-gradient(circle at 50% 40%,rgba(26,109,149,.22),rgba(3,18,38,.63));
  display:flex;flex-direction:column;align-items:center;gap:5px;margin:18px 0 8px;text-align:center;}
.countdown-stage>span{font-size:10px;letter-spacing:2px;color:#82dafa;font-weight:800;}
.countdown-stage>strong{font:900 clamp(74px,11vw,115px)/1.14 Consolas,monospace;letter-spacing:-6px;color:white;text-shadow:0 0 30px rgba(104,222,255,.3);font-variant-numeric:tabular-nums;}
.countdown-stage>small{font-size:10px;letter-spacing:1.4px;color:#b3e4f5;}
.countdown-progress{height:5px;width:100%;background:#1b374b;overflow:hidden;border-radius:4px;margin-top:16px;}
.countdown-progress span{display:block;height:100%;background:linear-gradient(90deg,#36bbef,#80f0d6);transition:width .75s linear;}
.countdown-stage--liftoff{border-color:rgba(104,241,185,.55);box-shadow:0 0 42px rgba(67,226,169,.16);}
.countdown-stage--liftoff>strong{color:#92fbd1;animation:liftoff-glow 1.2s infinite alternate;}
.checklist-page--countdown .checklist-panel{box-shadow:0 0 44px rgba(51,154,213,.07);}

.debrief-hero{overflow:hidden;position:relative;}
.debrief-hero:after{content:"";position:absolute;right:-100px;top:-130px;width:340px;height:340px;
  border:1px solid rgba(108,200,233,.08);border-radius:50%;pointer-events:none;}
.medal-card{animation:medal-arrive .6s both;animation-delay:calc(var(--medal-order) * .11s);}
.debrief-score #animated-score{font-variant-numeric:tabular-nums;}
.debrief-advice{border-top:1px solid rgba(126,176,207,.21);margin:20px 0 0;padding-top:17px;}
.debrief-advice>strong{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.6px;color:#b1f4df;}
.debrief-advice p{display:flex;align-items:flex-start;gap:8px;color:#b9cfe1;line-height:1.55;margin:10px 0 0;font-size:11px;}
.debrief-advice svg{flex-shrink:0;color:#7fe0c6;margin-top:2px;}
.debrief-actions{justify-content:flex-start;flex-wrap:wrap;}
.debrief-actions button{white-space:nowrap;}
.review-panel{padding:25px;margin-top:19px;animation:detail-in .25s ease-out;}
.review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:22px;}
.review-phase{border:1px solid rgba(96,175,221,.22);background:rgba(7,27,49,.6);border-radius:10px;padding:18px;}
.review-phase-index{font:10px/1.3 Consolas,monospace;color:#71d6f7;letter-spacing:1px;}
.review-phase h3{font-size:14px;color:#f2f9ff;margin:10px 0;}
.review-phase p{font-size:11px;color:#a5bdd3;line-height:1.55;min-height:65px;}
.review-phase>div:not(:first-child){display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;font-size:10px;color:#8fb0c8;}
.review-phase>div strong{color:#b7ebf7;white-space:nowrap;}
.review-disclaimer{margin-top:17px;font-size:10px;color:#8aa8bf;line-height:1.6;}

.mission-captions{
  position:fixed;left:50%;bottom:14px;z-index:60;
  display:none;gap:13px;align-items:center;
  width:min(730px,calc(100vw - 28px));transform:translateX(-50%);
  border:1px solid rgba(98,214,239,.5);border-radius:12px;
  background:linear-gradient(110deg,rgba(7,25,46,.96),rgba(10,39,62,.96));
  backdrop-filter:blur(20px);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 32px rgba(50,183,218,.12);
  padding:13px 16px;color:#ebf8ff;
}
.mission-captions--active{display:flex;animation:caption-in .28s ease-out;}
.caption-emblem{height:37px;width:37px;flex:0 0 37px;border-radius:8px;display:grid;place-items:center;
  background:rgba(82,204,242,.13);color:#9bdbfa;border:1px solid rgba(91,211,246,.24);}
.caption-copy{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;}
.caption-copy strong{font-size:9px;letter-spacing:1.5px;color:#7fe1fc;}
.caption-copy>span{font-size:12px;line-height:1.5;color:#e4f3ff;}
.caption-hide{border:0;background:transparent;color:#a7d2e9;padding:4px 8px;font-size:22px;line-height:1;align-self:flex-start;}
.caption-hide:hover{color:white;}
@keyframes scan-pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.2)}}
@keyframes detail-in{from{opacity:.55;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes caption-in{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes medal-arrive{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes liftoff-glow{to{text-shadow:0 0 45px rgba(91,255,190,.8)}}
@media (max-width:1350px){
  .header-right{gap:7px;}.header-steps{gap:10px;}
  .header-voice{font-size:9px;padding:7px;}
  .header-name{display:none;}
}
@media (max-width:1000px){
  .header-steps{display:none;}
  .app-header{height:70px;}
  .explore-detail{grid-template-columns:55px 1fr;gap:12px;}
  .explore-marker{width:54px;height:58px;}
  .explore-detail>.listen-inline{grid-column:2;justify-self:start;}
  .review-grid{grid-template-columns:1fr;}
  .review-phase p{min-height:0;}
}
@media (max-width:690px){
  .header-right .system-online,.header-right .header-divider{display:none;}
  .header-sound-settings{width:32px;}
  .briefing-hero{padding-top:40px;min-height:450px;}
  .hero-actions{flex-wrap:wrap;}
  .hero-actions .button{min-width:200px;}
  .explore-detail{padding:15px 13px;}
  .explore-text h3{font-size:16px;}
  .rule-inspector{padding:13px 12px;gap:10px;}
  .rule-inspector .inspector-icon{display:none;}
  .console-head small{display:none;}
  .console-line{gap:6px;font-size:9.5px;}
  .console-line strong{display:none;}
  .launch-panel .button--launch{font-size:10px;}
  .mission-captions{bottom:8px;padding:11px;}
  .caption-copy>span{font-size:11px;}
  .debrief-actions .button{flex:1 1 100%;justify-content:center;}
}

/* Keep icon, classification, title, and explanatory text on separate lines. */
.interactive-rule>span:last-child { display:flex;flex-direction:column;gap:4px;flex:1;min-width:0; }
.interactive-rule .rule-name { display:block;font-size:9px;letter-spacing:1.7px;line-height:1.25;margin:0; }
.interactive-rule strong { white-space:normal;display:block;line-height:1.35;font-size:12px; }

.launch-rocket-visual{position:relative;height:90px;display:flex;justify-content:center;align-items:flex-start;margin:10px auto 0;width:90px;}
.launch-rocket-visual>span{color:#a5eeff;transform:rotate(-42deg);animation:rocket-rise 1.55s ease-out forwards;filter:drop-shadow(0 0 11px rgba(93,228,255,.8));z-index:2;}
.launch-rocket-visual>i{position:absolute;width:23px;height:60px;bottom:-12px;left:49px;transform:rotate(40deg);border-radius:55% 55% 100% 100%;background:linear-gradient(180deg,rgba(152,235,255,.95),rgba(255,191,86,.75),transparent);filter:blur(2px);animation:flame-flicker .22s infinite alternate;}
@keyframes rocket-rise{0%{transform:translateY(28px) rotate(-42deg) scale(.86);opacity:.4}100%{transform:translateY(-20px) rotate(-42deg) scale(1.12);opacity:1}}
@keyframes flame-flicker{to{transform:rotate(40deg) scale(.85,1.15);opacity:.65}}
@media (prefers-reduced-motion:reduce){.launch-rocket-visual>span,.launch-rocket-visual>i{animation:none!important}}

/* Scene cues follow the active lesson or flight phase, not the timing of a voice timer. */
.app-shell .offline-earth,.app-shell .offline-moon { transition:opacity .75s ease,filter .75s ease; }
.app-shell[data-visual-scene="moon"] .offline-earth { opacity:.25;filter:brightness(.40) saturate(.60); }
.app-shell[data-visual-scene="moon"] .offline-moon { opacity:1;filter:brightness(1.20) saturate(1.10) drop-shadow(0 0 22px rgba(160,208,255,.25)); }
.app-shell[data-visual-scene="earth-return"] .offline-earth { opacity:1;filter:brightness(1.17) saturate(1.20) drop-shadow(0 0 20px rgba(84,173,252,.17)); }
.app-shell[data-visual-scene="earth-return"] .offline-moon { opacity:.26;filter:brightness(.5); }
.flight-feature-orbit[data-visual-phase="moon"] .flight-planet--moon { filter:brightness(1.7) drop-shadow(0 0 15px rgba(171,218,255,.55)); transform:scale(1.24); }
.flight-feature-orbit[data-visual-phase="moon"] .flight-planet--earth { opacity:.4; }
.flight-feature-orbit[data-visual-phase="earth-return"] .flight-planet--earth,
.flight-feature-orbit[data-visual-phase="splashdown"] .flight-planet--earth { filter:brightness(1.5) drop-shadow(0 0 15px rgba(94,194,250,.45));transform:scale(1.08); }
.check-item--scanning,.check-item--scanning .check-item-status { transition:background .25s ease; }
.integration-error { display:flex;align-items:center;gap:10px;margin:0 0 20px;padding:12px 16px;border:1px solid rgba(255,108,108,.55);background:rgba(105,18,29,.26);color:#ffcecf;border-radius:10px;font-size:12px;font-weight:700; }

>JORNADA DA MISSÃO</span><span class="heading-divider"></span><span>TRÊS FASES. UMA HISTÓRIA.</span></div><div class="roadmap-grid">${phases.map((p,i)=>`<div class="roadmap-phase"><div class="roadmap-index">0${i+1}<span class="roadmap-node"></span></div><div class="roadmap-details"><strong>${p[0]}</strong><small>${p[1]}</small></div>${i<2?icon('arrow',17):''}</div>`).join('')}</div><div class="mission-overview-heading mission-overview-heading--rules"><span>QUATRO REGRAS PARA SOBREVIVER</span><span class="heading-divider"></span><span>LEARN BY DOING</span></div><div class="rules-grid">${rules.map(r=>`<div class="rule-card"><div class="rule-icon rule-icon--${r[4]}">${icon(r[3],20)}</div><div><span class="rule-name">${r[0]}</span><strong>${r[1]}</strong><p>${r[2]}</p></div></div>`).join('')}</div><div class="briefing-tip">${tip('Conselho da Diretora de Voo','A Artemis II real foi um sobrevoo tripulado da Lua, sem pouso na superfície. Neste jogo, as decisões são inspiradas em desafios de engenharia espacial.')}</div></section><div class="briefing-footer-note">PROTÓTIPO EDUCACIONAL · PARTE 1 — NICOLAS <span>●</span> DADOS DA MISSÃO SIMULADOS</div></main>`;}

function clamp(v,lo=0,hi=100){return Math.min(hi,Math.max(lo,v));}
function transmit(ship,adding,share){if(!ship.antennaActive)return ship.scienceDataTransmittedMb;const total=ship.scienceDataCollectedMb+adding;return Math.min(total,ship.scienceDataTransmittedMb+Math.round((total-ship.scienceDataTransmittedMb)*share));}
function advance(){const p=state.flight;if(!p||p.phaseIndex>=3)return;const s=p.ship;const stage=p.phaseIndex+1;const previous={...s};let record;
  if(stage===1){const collected=115;s.scienceDataTransmittedMb=transmit(s,collected,.8);s.scienceDataCollectedMb+=collected;s.fuelRemainingDeltaV=clamp(s.fuelRemainingDeltaV-450,0,5000);s.batteryChargePercent=clamp(s.batteryChargePercent-7);s.missionElapsedDays+=2;record={phase:1,title:'Órbita terrestre concluída',description:'A Orion passou pelas checagens e iniciou o percurso em direção à Lua.',collectedMb:collected};}
  else if(stage===2){const collected=315;s.scienceDataTransmittedMb=transmit(s,collected,.94);s.scienceDataCollectedMb+=collected;s.fuelRemainingDeltaV=clamp(s.fuelRemainingDeltaV-620,0,5000);s.batteryChargePercent=clamp(s.batteryChargePercent-29);s.blackoutMinutes+=42;s.missionElapsedDays+=4;record={phase:2,title:'Sobrevoo lunar concluído',description:'A nave acumulou dados durante o blecaute e tentou transmiti-los depois.',collectedMb:collected};}
  else{const collected=48;const safeFuel=s.fuelRemainingDeltaV>=160;const safeAngle=s.reentryAngleDeg>=5.5&&s.reentryAngleDeg<=7.0;const safeShield=s.heatShieldInstalled&&s.heatShieldHealthPercent>=60;s.crewSafe=safeFuel&&safeAngle&&safeShield&&s.batteryChargePercent>0;s.scienceDataTransmittedMb=transmit(s,collected,1);s.scienceDataCollectedMb+=collected;s.fuelRemainingDeltaV=clamp(s.fuelRemainingDeltaV-160,0,5000);s.batteryChargePercent=clamp(s.batteryChargePercent-12);s.heatShieldHealthPercent=clamp(s.heatShieldHealthPercent-(s.crewSafe?34:88));s.missionElapsedDays+=3.1;record={phase:3,title:s.crewSafe?'Reentrada e amerissagem concluídas':'Reentrada fora dos critérios do jogo',description:s.crewSafe?'A cápsula retornou e foi recuperada no oceano.':'A simulação encontrou condições inseguras para a reentrada.',collectedMb:collected};}
  record.fuelSpentDeltaV=previous.fuelRemainingDeltaV-s.fuelRemainingDeltaV;
  record.batterySpentPercent=previous.batteryChargePercent-s.batteryChargePercent;

function flightPage(){const p=state.flight;if(!p)return'';const s=p.ship;const complete=p.phaseIndex===3;const active=phases[Math.min(p.phaseIndex,2)];const states=[['ORBITAL CHECKOUT','A cápsula realiza verificações na órbita terrestre e inicia a jornada lunar.', ['Checagem da nave','Partida translunar']],['LUNAR FLYBY','O rádio pode ficar bloqueado atrás da Lua. Dados precisam ser armazenados.', ['Blecaute de rádio','Uso da bateria']],['EARTH RETURN','A tripulação se aproxima da Terra. O ângulo de reentrada e o escudo serão decisivos.', ['Correção de trajetória','Amerissagem']]];const detail=states[Math.min(p.phaseIndex,2)];return `<main class="page flow-page flight-page"><div class="flow-heading"><div>${eyebrow('MISSION SIMULATION / INTEGRATION BRIDGE')}<h1>${complete?'Jornada ':'Missão em '}<span>${complete?'concluída.':'andamento.'}</span></h1><p>Uma demonstração simplificada da continuidade dos recursos entre as fases da equipe.</p></div><span class="label-demo">SIMULAÇÃO DIDÁTICA</span></div><div class="flight-timeline">${phases.map((phase,index)=>`<div class="flight-timeline-phase ${p.phaseIndex>index?'flight-timeline-phase--completed':p.phaseIndex===index?'flight-timeline-phase--active':''}"><div class="flight-timeline-symbol">${icon(p.phaseIndex>index?'check':['earth','moon2','satellite'][index],20)}</div><div><small>FASE 0${index+1}</small><strong>${phase[0]}</strong></div>${index<2?'<div class="flight-timeline-line"></div>':''}</div>`).join('')}</div><div class="flow-grid flight-grid"><section class="glass-panel flight-main-panel"><div class="panel-heading"><span class="panel-heading-icon">${icon('rocket',19)}</span><div><h2>${complete?'Relatório disponível':detail[0]}</h2><p>${complete?'As três fases foram registradas.':'Acompanhamento da jornada da Orion.'}</p></div></div><div class="flight-feature"><div class="flight-feature-orbit"><span class="flight-orbit-a"></span><span class="flight-orbit-b"></span><span class="flight-planet flight-planet--earth">     if (d.status === 'running' || d.status === 'countdown' || d.status === 'liftoff') {
      clearAsync();
      speech.stop();
      state.ui.diagnostics = {
        status: 'idle', entries: [], revealed: [], activeIndex: -1,
        progress: 0, signature: null, result: null, remaining: 10, history: []
      };
      if (announce) speech.say('Countdown or diagnostics canceled. The spacecraft remains on the ground.');
    }
  }
  function invalidateDiagnostics(message = '') {
    clearAsync();
    state.ui.diagnostics = {
      status: 'idle', entries: message ? [{ message, tone: 'warn', time: new Date().toLocaleTimeString('en-US', { hour12: false }) }] : [], revealed: [],
      activeIndex: -1, progress: 0, signature: null, result: null,
      remaining: 10, history: []
    };
  }
  function systemMessage(message, tone = 'info') {
    const d = diagnostics();
    d.entries.push({ message, tone, time: new Date().toLocaleTimeString('en-US', { hour12: false }) });
    if (d.entries.length > 10) d.entries.shift();
  }
  const systemNames = [
    'Vehicle mass', 'Electrical power', 'Thermal protection',
    'Communications link', 'Propellant reserve'
  ];
  const diagnosticSummary = (item, index) => {
    const shortStatus = item.status === 'green' ? 'GREEN. Nominal.' : item.status === 'yellow' ? 'YELLOW. Caution.' : 'RED. Check failed.';
    return `${systemNames[index]}: ${shortStatus}`;
  };
  function clearanceAnnouncement(result, forCountdown = false) {
    if (result.greens === 5) return forCountdown
      ? 'Flight Director, all five stations report GO. Artemis II is cleared for launch. Initiating terminal countdown.'
      : 'Flight Director, five green checks confirmed. Artemis II is cleared for the terminal countdown.';
    const remaining = result.items.filter(item => item.status !== 'green');
    const caution = remaining.some(item => item.id === 'antenna')
      ? 'Communications remain offline; science data will stay in the onboard buffer.'
      : 'One noncritical caution remains on the checklist.';
    return forCountdown
      ? `Flight Director, four green checks meet the game launch criteria. ${caution} Launch authorized with caution. Initiating terminal countdown.`
      : `Flight Director, four of five checks are green. ${caution} Educational launch criteria satisfied with caution.`;
  }
  function runDiagnostics() {
    if (state.screen !== 'checklist') return;
    if (diagnostics().status === 'running' || diagnostics().status === 'countdown') return;
    clearAsync();
    if (state.ui.validationError) {
      systemMessage(`INVALID SPACECRAFT DATA · ${state.ui.validationError}`, 'bad');
      speech.say('Flight Director, invalid spacecraft data. Correct the integration input before launch diagnostics.');
      render();
      return;
    }
    const signature = shipSignature(state.ship);
    const result = checklist({ ...state.ship });
    const d = {
      status: 'running', entries: [], revealed: Array(5).fill(null), activeIndex: -1,
      progress: 0, signature, result, remaining: 10, history: []
    };
    state.ui.diagnostics = d;
    const current = () => state.screen === 'checklist' && d === diagnostics() &&
      signature === shipSignature(state.ship) && !state.ui.validationError;
    systemMessage('DIAGNOSTICS INITIALIZED · Scanning five launch requirements.');
    render();
    speech.say('Flight Director, beginning pre-launch diagnostics. All stations, stand by.', {
      scene: 'checklist',
      onDone: () => { if (current()) scan(0); }
    });
    function scan(index) {
      if (!current()) return;
      if (index >= 5) {
        d.activeIndex = -1;
        d.status = 'complete';
        const verdict = d.result.approved;
        systemMessage(verdict
          ? `GO VERIFIED · ${d.result.greens}/5 GREEN · no critical RED findings.`
          : `LAUNCH HOLD · ${d.result.greens}/5 GREEN · ${d.result.criticalReds} critical RED finding(s).`, verdict ? 'good' : 'bad');
        render();
        speech.say(verdict ? clearanceAnnouncement(d.result) :
          'Flight Director, we are NO-GO for launch. Review the highlighted systems and run diagnostics again.', {scene:'checklist'});
        return;
      }
      d.activeIndex = index;
      systemMessage(`CHECK 0${index + 1} · ${systemNames[index].toUpperCase()} · IN PROGRESS`);
      render();
      speech.say(`Checking ${systemNames[index]}.`, {
        scene: `check-${index+1}`,
        onDone: () => {
          if (!current()) return;
          const item = d.result.items[index];
          d.revealed[index] = item.status;
          d.progress = index + 1;
          const tone = item.status === 'green' ? 'good' : item.status === 'red' ? 'bad' : 'warn';
          systemMessage(`CHECK 0${index + 1} · ${diagnosticSummary(item, index)}`, tone);
          d.history.push({ id: item.id, status: item.status, value: item.value, detail: item.detail });
          render();
          speech.say(diagnosticSummary(item, index), {
            scene: `check-${index+1}`,
            onDone: () => {
              if (!current()) return;
              d.activeIndex = -1;
              render();
              queue(() => scan(index + 1), 180);
            }
          });
        }
      });
    }
  }
  const isVerifiedForLaunch = () => {
    const d = diagnostics();
    return !state.ui.validationError && phase1WarningsAcknowledged() && phase1Gates().eligible && d.status === 'complete' && d.result && d.result.approved &&
      d.signature === shipSignature(state.ship) && checklist(state.ship).approved;
  };
  function cancelRunningDiagnostics() {
    if (diagnostics().status !== 'running') return;
    invalidateDiagnostics('Diagnostic scan canceled by Flight Director.');
    speech.say('Flight Director, pre-launch diagnostics canceled.');
    render();
  }
  function startCountdown() {
    if (!isVerifiedForLaunch() || state.screen !== 'checklist') {
      invalidateDiagnostics('Launch authorization expired. Run diagnostics again.');
      speech.say('Launch on hold. A new systems check is required.');
      render();
      return;
    }
    const d = diagnostics();
    try { v3RecordChecklistApproved(); }
    catch (error) { invalidateDiagnostics(error.message); render(); return; }
    const verifiedSignature = d.signature;
    d.status = 'countdown';
    d.remaining = 10;
    d.clearance = true;
    systemMessage('MISSION CONTROL · Flight Director clearance confirmed.');
    render();
    const stillCleared = () => d === diagnostics() && d.status === 'countdown' &&
      state.screen === 'checklist' && verifiedSignature === shipSignature(state.ship) &&
      !state.ui.validationError && checklist(state.ship).approved;
    const tick = number => {
      if (!stillCleared()) return;
      if (number === 0) {
        d.status = 'liftoff';
        systemMessage('T PLUS ZERO · LIFTOFF', 'good');
        render();
        speech.say('Ignition. Liftoff! Artemis II is on its way!', {
          scene: 'liftoff', onDone: () => {
            if (d !== diagnostics() || d.status !== 'liftoff') return;
            goto('departure');
          }
        });
        return;
      }
      d.remaining = number;
      d.clearance = false;
      render();
      const start = performance.now();
      const word = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'][number];
      speech.say(`${word}.`, {
        scene: `countdown-${number}`,
        onDone: () => {
          if (!stillCleared()) return;
          // Maintain at least a one-second cadence without clipping a slow voice.
          const rest = Math.max(0, 1000 - (performance.now() - start));
          queue(() => tick(number - 1), rest);
        }
      });
    };
    speech.say(clearanceAnnouncement(d.result, true), {
      scene: 'countdown-clearance',
      onDone: () => { if (stillCleared()) tick(10); }
    });
  }
  function abortCountdown() {
    const d = diagnostics();
    if (d.status !== 'countdown') return;
    clearAsync();
    d.status = 'complete';
    d.remaining = 10;
    d.clearance = false;
    systemMessage('HOLD · Countdown aborted by Flight Director.', 'warn');
    speech.say('Flight Director, countdown aborted. The launch vehicle remains safe.');
    render();
  }

  // The checker retains the original game thresholds while translating every result to en-US.
  checklist = function(ship = state.ship) {
    const mass = ship.totalMassKg > MASS_LIMIT ? 'red' : ship.totalMassKg > MASS_GREEN ? 'yellow' : 'green';
    const energy = ship.batteryChargePercent <= 0 || ship.powerBalanceWatts <= 0 ? 'red' :
      ship.batteryChargePercent <= 20 ? 'yellow' : 'green';
    const shield = !ship.heatShieldInstalled || ship.heatShieldHealthPercent <= 0 ? 'red' :
      ship.heatShieldHealthPercent < 60 ? 'yellow' : 'green';
    const antenna = ship.antennaActive ? 'green' : 'red';
    const fuel = ship.fuelRemainingDeltaV <= 0 ? 'red' :
      ship.fuelRemainingDeltaV < 1200 ? 'yellow' : 'green';
    const statuses = [mass, energy, shield, antenna, fuel];
    const values = [
      `${fmt(ship.totalMassKg)} kg`,
      `${fmt(ship.batteryChargePercent)}% · ${ship.powerBalanceWatts > 0 ? '+' : ''}${fmt(ship.powerBalanceWatts)} W`,
      ship.heatShieldInstalled ? `${fmt(ship.heatShieldHealthPercent)}% integrity` : 'NOT INSTALLED',
      ship.antennaActive ? 'LINK ACTIVE' : 'LINK OFFLINE',
      `${fmt(ship.fuelRemainingDeltaV)} m/s (Δv)`
    ];
    const descriptions = [
      mass === 'red' ? 'Vehicle mass exceeds the game limit.' : mass === 'yellow' ?
        'Within the game limit, but the recommended safety margin is not met.' : 'Mass is within the game limit and recommended 15% margin.',
      energy === 'red' ? 'Launch blocked: battery is depleted or net electrical power is not positive.' : energy === 'yellow' ?
        'Battery reserve is low; recharge before launch for a stronger safety margin.' : 'Battery is charged and electrical generation exceeds demand.',
      shield === 'red' ? 'The heat shield is missing or unusable.' : shield === 'yellow' ?
        'Thermal protection integrity is reduced.' : 'Thermal protection is installed and ready.',
      antenna === 'green' ? 'A communication link is available.' : 'Science data must remain in onboard buffer storage.',
      fuel === 'red' ? 'No maneuvering propellant remains.' : fuel === 'yellow' ?
        'Maneuvering reserve is reduced.' : 'Maneuvering reserve meets the game goal.'
    ];
    const items = resources.map((resource, index) => ({
      ...resource, status: statuses[index], value: values[index], detail: descriptions[index]
    }));
    const greens = items.filter(item => item.status === 'green').length;
    const criticalReds = items.filter(item => item.critical && item.status === 'red').length;
    return { items, greens, criticalReds, approved: greens >= 4 && criticalReds === 0 };
  };

              <span class="check-item-status">${scanning?'<span class="status-light status-light--scanning"></span><span>SCANNING</span>':status?`${lights(status)}<span>${{green:'GREEN / PASS',yellow:'YELLOW / CAUTION',red:'RED / FAIL'}[status]}</span>`:'<span class="status-light status-light--pending"></span><span>PENDING</span>'}</span>
              <span class="check-chevron ${expanded?'check-chevron--open':''}">${icon('chevron',15)}</span></button>
            ${expanded?`<div class="check-item-expanded">${icon('info',17)}<div>
              <p>${status?escape(item.detail):'Run diagnostics to verify this value. The preliminary engineering input is '+escape(item.value)+'.'}</p>

        }).join('')}</div>
        <div class="checklist-legend"><span>${lights('green')} PASS</span><span>${lights('yellow')} CAUTION</span><span>${lights('red')} FAIL</span>
          <span class="legend-hint">Select any system to see an explanation.</span></div>
        <div class="diagnostic-console"><div class="console-head"><span><span class="console-pulse"></span> LIVE MISSION CONTROL LOG</span><small>EDUCATIONAL SIMULATION</small></div>
          <div class="console-lines" id="diagnostic-console-lines" role="log" aria-label="Pre-launch diagnostic events">
          ${d.entries.length?d.entries.map(entry => `<div class="console-line console-line--${entry.tone}"><span>[${escape(entry.time)}]</span><strong>FLIGHT</strong><span>${escape(entry.message)}</span></div>`).join(''):
          '<div class="console-empty">SYSTEM READY · Press RUN PRE-LAUNCH DIAGNOSTICS to begin.</div>'}
          </div></div>
      </section><aside class="glass-panel launch-panel">
        <div class="launch-panel-top"><span>MISSION AUTHORIZATION</span><small>GREEN CHECK SCORE</small></div>
        <div class="launch-score-ring launch-score-ring--${go?'go':'no-go'}" style="--score:${countGreens*20}%"><div>
          <strong>${countGreens*20}<small>%</small></strong><span>VERIFIED GREEN</span></div></div>
        <div class="launch-panel-lines"><div><span>Green checks</span><strong>${countGreens} / 5</strong></div>${meter(countGreens*20,go?'green':'amber')}
          <div><span>Critical red failures</span><strong class="${isComplete&&d.result.criticalReds?'text-danger':'text-success'}">${observed?d.result.items.slice(0,observed).filter(item=>item.critical&&item.status==='red').length:0}</strong></div></div>
        ${inCountdown ? `<div class="countdown-stage"><span>${d.clearance?'FLIGHT DIRECTOR CLEARANCE':'TERMINAL COUNTDOWN'}</span><strong>${d.clearance?'GO':String(d.remaining).padStart(2,'0')}</strong>
          <small>${d.clearance?(d.result?.greens===5?'ALL FIVE STATIONS REPORT GO':'FOUR GREEN · CAUTION ACCEPTED'):`T - ${d.remaining} SECONDS`}</small><div class="countdown-progress"><span style="width:${(10-d.remaining)*10}%"></span></div></div>
          <button class="button button--outline button--launch" data-action="abort-countdown">${icon('warning',18)} ABORT COUNTDOWN</button>` :
          isLiftoff ? `<div class="countdown-stage countdown-stage--liftoff"><span>MISSION TIME</span><strong>T+00</strong><small>LIFTOFF CONFIRMED</small><div class="launch-rocket-visual"><span>${icon('rocket',48)}</span><i></i></div></div>` :
          `<div class="launch-verdict launch-verdict--${go?'go':'no-go'}">${icon(go?'check':'lock',22)}<div>
            <strong>${isComplete?(go?(d.result.greens===5?'ALL FIVE STATIONS GO':'GO WITH CAUTION'):'LAUNCH HOLD'):'AWAITING DIAGNOSTICS'}</strong>
            <p>${running?'System checks are running…':isComplete?(go?(d.result.greens===5?'All five systems passed; terminal count is available.':'Four GREEN checks satisfy the game rule. Any remaining caution must be explained.') :d.result.criticalReds?'Critical faults must be corrected.':'A minimum of four GREEN checks is required.'):'Launch approval requires a completed diagnostic scan.'}</p></div></div>
          ${running?`<button class="button button--outline button--launch" data-action="cancel-diagnostics">${icon('warning',18)} CANCEL DIAGNOSTICS</button>`:
          `<button class="button button--outline button--launch" data-action="run-diagnostics">${icon('activity',18)} ${isComplete?'RERUN DIAGNOSTICS':'RUN PRE-LAUNCH DIAGNOSTICS'}</button>`}
          <button class="button button--primary button--launch" data-action="start-countdown" ${approvedToLaunch?'':'disabled'}>${icon(approvedToLaunch?'rocket':'lock',19)} ${approvedToLaunch?'AUTHORIZE LAUNCH':'LAUNCH LOCKED'} ${icon('arrow',18)}</button>`}
        <p class="launch-panel-caption">${inCountdown?'The Flight Director can abort at any time.':go?'The terminal countdown will begin at T−10 seconds.':'Correct any problems, then rerun the scan.'}</p>
        <div class="mission-director-tag">${icon('radio',16)} <span>MISSION CONTROL VOICE <b>${audio.enabled?'ENABLED':'MUTED'}</b></span></div>
        </aside></div>
      <div class="checklist-footnote">${icon('warning',17)}<span><strong>Educational simulation:</strong> NASA uses “CML 4” for <em>Concept Maturity Level 4 (Point Design)</em>, not an operational launch checklist. The ${fmt(MASS_LIMIT)} kg mass limit and all GO/NO-GO thresholds are fictional game values.</span></div>
      <div class="flow-actions"><button class="button button--text" data-action="to-hangar" ${running||inCountdown?'disabled':''}>${icon('back',17)} ADJUST SPACECRAFT</button>
        <span class="inline-assist">${icon('shield',16)} Crew safety comes first.</span></div>
    </main>`;
  };

  const originalAdvance = advance;
  advance = function() {
    const before = state.flight?.phaseIndex;
    originalAdvance();
    const flight = state.flight;
    if (!flight || flight.phaseIndex === before) return;
    const latest = flight.history[flight.history.length-1];
    const englishHistory = [
      ['Earth-orbit checkout complete', 'Orion has completed the simulated checkout and begun its journey to the Moon.'],
      ['Lunar flyby complete', 'The spacecraft buffered data during loss of contact and sent it after the radio link returned.'],
      ['Earth return complete', flight.ship.crewSafe
        ? 'The crew splashed down safely in this educational simulation.'
        : 'The simulated return did not satisfy all safety conditions.']
    ];
    [latest.title, latest.description] = englishHistory[flight.phaseIndex-1];
    const announcements = [
      'Flight Director, Earth orbit checkout is complete. The lunar far-side scene is now displayed. Prepare for radio blackout and science data buffering.',
      'Flight Director, the lunar flyby is complete. The Earth return scene is now displayed. Prepare for trajectory correction and reentry.',
      flight.ship.crewSafe
        ? 'Flight Director, the splashdown scene is displayed. The crew is safe. Excellent work.'
        : 'Flight Director, the Earth return is unsafe in this simulation. Review the outcome.'
    ];
    const expected = flight.phaseIndex;
    queue(() => {
      if (state.screen === 'flight' && state.flight === flight && flight.phaseIndex === expected) {
        speech.say(announcements[expected-1], { scene:expected===3?'flight-complete':`flight-phase-${expected+1}` });
      }
    }, 0);
  };

  flightPage = function() {
    const p = state.flight;
    if (!p) return '';
    const ship = p.ship;
    const complete = p.phaseIndex === 3;
    const stageData = [

    return `<main class="page flow-page flight-page"><div class="flow-heading"><div>
      ${eyebrow('DEMO FLIGHT / TEAM INTEGRATION BRIDGE')}<h1>${complete?'Journey ':'Mission '}<span>${complete?'complete.':'in progress.'}</span></h1>

        ${p.phaseIndex===2?`<div class="entry-angle-control"><div class="entry-angle-heading"><span>${icon('shield',17)} Reentry angle (game model)</span>

          <input data-key="reentryAngleDeg" aria-label="Reentry angle" type="range" min="4.5" max="8" step="0.1" value="${ship.reentryAngleDeg}" />
          <div class="angle-scale"><span>4.5°</span><span>GAME GREEN ZONE: 5.5°–7.0°</span><span>8.0°</span></div></div>`:''}

          ${p.history.length? p.history.map(rec=>`<div class="flight-history-item"><span class="history-check">${icon('check',17)}</span>
            <div><strong>${escape(rec.title)}</strong><p>${escape(rec.description)}</p></div><small>PHASE 0${rec.phase}</small></div>`).join(''):
            `<div class="flight-no-history">${icon('info',17)} Run Phase 1 to record the first mission event.</div>`}</div>
        <div class="flight-main-actions"><button class="button button--primary" data-action="${complete?'to-debrief':'advance'}">${complete?'OPEN MISSION DEBRIEFING':p.phaseIndex===0?'RUN PHASE 1':p.phaseIndex===1?'RUN PHASE 2':'SIMULATE REENTRY'} ${icon('arrow',18)}</button>
          <small>${complete?'Mission data are ready.':'Resources carry over unchanged until the next phase updates them.'}</small></div>

        ${metric('SCIENCE COLLECTED',fmt(ship.scienceDataCollectedMb),'megabytes (MB)','mint')}
        ${metric('DATA SENT',fmt(ship.scienceDataTransmittedMb),'megabytes (MB)','violet')}</div>
      <div class="telemetry-gauge-list"><div><span>${icon('battery',15)} Battery</span><strong>${fmt(ship.batteryChargePercent)}%</strong></div>
        ${meter(ship.batteryChargePercent,ship.batteryChargePercent>=20?'cyan':'amber')}
        <div><span>${icon('fuel',15)} Maneuver reserve</span><strong>${fmt(ship.fuelRemainingDeltaV)} m/s</strong></div>${meter(ship.fuelRemainingDeltaV/4400*100,'amber')}
        <div><span>${icon('database',15)} Buffer storage</span><strong>${fmt(ship.scienceDataCollectedMb-ship.scienceDataTransmittedMb)} MB</strong></div>
        ${meter((ship.scienceDataCollectedMb-ship.scienceDataTransmittedMb)/500*100,'green')}</div>

  };

  report = function() {
    const flight = state.flight;
    if (!flight) return null;
    const s = flight.ship;
    const crewSafe = flight.phaseIndex === 3 && s.crewSafe === true;
    const score = (crewSafe?500:0) + Math.min(300,Math.round(s.scienceDataTransmittedMb*.7)) +
      (s.fuelRemainingDeltaV>=300?100:0) + (s.batteryChargePercent>=15?100:0);
    const medals = [
      { id:'return', title:'Safe Return', description:'Recover the crew safely.', earned: crewSafe },
      { id:'science', title:'Lunar Scientist', description:'Transmit at least 250 MB of science data.', earned:s.scienceDataTransmittedMb>=250 },
      { id:'resources', title:'Resource Manager', description:'Retain 300 m/s delta-v and at least 15% battery.', earned:s.fuelRemainingDeltaV>=300&&s.batteryChargePercent>=15 },
      { id:'director', title:'Flight Director', description:'Earn all other mission medals.', earned: crewSafe&&s.scienceDataTransmittedMb>=250&&s.fuelRemainingDeltaV>=300&&s.batteryChargePercent>=15 }
    ];
    return {
      missionId:'ARTEMIS-II-NICOLAS-EDU-DEMO', completed:flight.phaseIndex===3,
      crewSafe, score,
      grade:score>=900?'OUTSTANDING':score>=700?'EXCELLENT':score>=450?'NEEDS IMPROVEMENT':'MISSION REVIEW REQUIRED',
      scienceCollectedMb:s.scienceDataCollectedMb, scienceTransmittedMb:s.scienceDataTransmittedMb,
      scienceBufferedMb:Math.max(0,s.scienceDataCollectedMb-s.scienceDataTransmittedMb),
      fuelRemainingDeltaV:s.fuelRemainingDeltaV,
      batteryRemainingPercent:s.batteryChargePercent,
      heatShieldRemainingPercent:s.heatShieldHealthPercent,
      blackoutMinutes:s.blackoutMinutes,
      simulatedDays:s.missionElapsedDays, reentryAngleDeg:s.reentryAngleDeg,
      medals, history:flight.history,
      educationalDisclaimer:'Game resources, safety thresholds, medal rules, scores, and data volumes are fictional educational parameters, not official NASA telemetry.',
      historicalReference:'https://www.nasa.gov/mission/artemis-ii/'
    };
  };
  debrief = function() {
    const r = report();
    if (!r) return '';
    const recommendations = [];
    if (!r.crewSafe) recommendations.push('Review reentry angle, heat-shield integrity, propellant and battery reserves.');
    if (r.scienceBufferedMb>0) recommendations.push('Keep communications available to send the remaining buffered science data.');
    if (r.batteryRemainingPercent<15) recommendations.push('Preserve battery reserves for spacecraft systems and potential eclipses.');
    if (r.fuelRemainingDeltaV<300) recommendations.push('Reserve more delta-v for the return and course-correction maneuvers.');
    if (!recommendations.length) recommendations.push('Well done. Your crew returned safely while preserving key resources.');
    return `<main class="page flow-page debrief-page"><div class="flow-heading"><div>${eyebrow('MISSION DEBRIEF / FINAL REPORT')}
      <h1>Mission <span>debriefing.</span></h1><p>Your decisions, crew outcome, mission awards, and comparison with real NASA history.</p></div>
      <span class="top-status top-status--${r.crewSafe?'go':'no-go'}"><span class="top-status-dot"></span>${r.crewSafe?'CREW SAFE':'CREW AT RISK'}</span></div>
      <div class="debrief-hero glass-panel"><div class="debrief-result-emblem ${r.crewSafe?'debrief-result-emblem--success':'debrief-result-emblem--failure'}">${icon(r.crewSafe?'check':'close',32)}</div>
        <div class="debrief-result-copy"><span>MISSION STATUS · SIMULATION</span><h2>${r.crewSafe?'Welcome home, Orion.':'Mission review required.'}</h2>
          <p>${r.crewSafe?'Splashdown is confirmed and the simulated crew returned safely. Congratulations, Flight Director.':'One or more simulated safety requirements were not met. Review the timeline and try again.'}</p></div>
        <div class="debrief-score"><span>FINAL SCORE</span><strong><span id="animated-score" data-score="${r.score}">${state.ui.scoreAnimated?fmt(r.score):'0'}</span><small>/ 1,000</small></strong><div>${r.grade}</div></div>
      </div>
      <div class="debrief-metrics">
        ${metric('DATA TRANSMITTED',`${fmt(r.scienceTransmittedMb)} MB`,`${fmt(r.scienceCollectedMb)} MB collected`)}
        ${metric('DATA BUFFERED',`${fmt(r.scienceBufferedMb)} MB`,'Awaiting transmission','violet')}
        ${metric('REMAINING Δv',`${fmt(r.fuelRemainingDeltaV)} m/s`,'Maneuvering reserve','amber')}
        ${metric('FINAL BATTERY',`${fmt(r.batteryRemainingPercent)}%`,'Energy remaining','mint')}
      </div>
      <div class="debrief-content-grid"><section class="glass-panel medals-panel"><div class="panel-heading"><span class="panel-heading-icon">${icon('medal',20)}</span><div><h2>Mission medals</h2><p>Achievements earned from your decisions.</p></div></div>
        <div class="medals-grid">${r.medals.map((medal,index)=>`<div class="medal-card ${medal.earned?'medal-card--earned':'medal-card--locked'}" style="--medal-order:${index}">
          <div class="medal-symbol">${icon(({return:'shield',science:'target',resources:'award',director:'trophy'})[medal.id],25)}</div>
          <strong>${medal.title}</strong><p>${medal.description}</p><span>${medal.earned?'AWARDED':'NOT EARNED'}</span></div>`).join('')}</div>
        <div class="mission-score-rule">${icon('sparkles',17)} Scores and medals are game achievements. They are not assigned by NASA.</div>
        <div class="debrief-advice"><strong>${icon('target',17)} FLIGHT DIRECTOR'S NOTES</strong>
          ${recommendations.map(text=>`<p>${icon('check',14)} ${escape(text)}</p>`).join('')}</div>
      </section><aside class="glass-panel reality-panel"><div class="panel-heading"><span class="panel-heading-icon">${icon('flag',19)}</span>
        <div><h2>NASA Artemis II · Real mission</h2><p>Verified historical facts; not game telemetry.</p></div></div>
        <div class="reality-heading">WHAT REALLY HAPPENED?</div>
        ${[['LAUNCH',NASA.launch],['SPLASHDOWN',NASA.splash],['DURATION',NASA.duration],['MISSION',NASA.type],['RECOVERY',NASA.landing],['CREW',NASA.crew]].map(pair=>`<div class="reality-row"><span>${pair[0]}</span><strong>${pair[1]}</strong></div>`).join('')}
        <div class="reality-divider"></div>
        <div class="reality-comparison" aria-label="Your simulated mission compared with real Artemis II">
          <strong>YOUR MISSION VS. REAL ARTEMIS II</strong>
          <div class="comparison-labels"><span>YOUR GAME</span><span>REAL NASA MISSION</span></div>
          <div class="comparison-pair"><span>${r.crewSafe?'Crew returned safely':'Crew return unsafe'}</span><span>Crew recovered safely</span></div>
          <div class="comparison-pair"><span>${fmtDecimal(r.simulatedDays)} simulated days</span><span>${NASA.duration}</span></div>
          <div class="comparison-pair"><span>${fmt(r.scienceTransmittedMb)} MB (game data)</span><span>Not directly comparable</span></div>
        </div>
        <div class="reality-divider"></div>
        <div class="reality-row"><span>GAME DURATION</span><strong>${fmtDecimal(r.simulatedDays)} simulated days</strong></div>
        <div class="reality-row"><span>GAME REENTRY</span><strong>${fmtDecimal(r.reentryAngleDeg)}° (simplified model)</strong></div>
        <div class="reality-row"><span>SCIENCE DATA</span><strong>Game numbers not comparable to NASA telemetry</strong></div>
        <a href="https://www.nasa.gov/mission/artemis-ii/" target="_blank" rel="noopener noreferrer" class="nasa-link">OFFICIAL NASA ARTEMIS II MISSION ${icon('external',15)}</a>
      </aside></div>
      ${state.ui.resultsExpanded?`<section class="glass-panel review-panel"><div class="panel-heading"><span class="panel-heading-icon">${icon('activity',19)}</span>
        <div><h2>Mission event review</h2><p>Review every phase and the recorded resource changes.</p></div></div>
        <div class="review-grid">${r.history.map((event,index)=>`<article class="review-phase"><div class="review-phase-index">PHASE 0${event.phase}</div><h3>${escape(event.title)}</h3>
          <p>${escape(event.description)}</p><div><span>Science collected</span><strong>${fmt(event.collectedMb)} MB</strong></div>
          <div><span>Delta-v used</span><strong>${fmt(event.fuelSpentDeltaV)} m/s</strong></div>
          <div><span>Battery consumed</span><strong>${fmt(event.batterySpentPercent)}%</strong></div>
          <div><span>Data transmitted</span><strong>${fmt(event.transmittedMb)} MB</strong></div></article>`).join('')}</div>
          <div class="review-disclaimer">${escape(r.educationalDisclaimer)}</div>
        </section>`:''}
      <div class="debrief-learning">${tip('Mission lesson', 'An entire lunar flight relies on coordination between mass, electrical power, radio communications, maneuvering propellant, and thermal protection.')}</div>
      <div class="debrief-actions">
        <button class="button button--outline" data-action="reset">${icon('reset',18)} REPLAY MISSION</button>
        <button class="button button--outline" data-action="review-results" aria-expanded="${state.ui.resultsExpanded}">${icon('file',18)} ${state.ui.resultsExpanded?'HIDE MISSION REVIEW':'REVIEW MISSION RESULTS'}</button>
        <button class="button button--outline" data-action="narrate-results">${icon('radio',18)} HEAR RESULTS</button>
        <button class="button button--primary" data-action="export">${icon('download',18)} DOWNLOAD REPORT JSON</button>
      </div>
      <div class="debrief-footer"><span>${icon('file',15)} ${r.missionId}</span><span>${icon('book',15)} EDUCATIONAL MODEL · NOT NASA-CERTIFIED</span>
        <a href="https://www.nasa.gov/news-release/nasa-welcomes-record-setting-artemis-ii-moonfarers-back-to-earth/" target="_blank" rel="noopener noreferrer">NASA RETURN REPORT ${icon('arrow',15)}</a></div>
    </main>`;
  };

  const baseGoto = goto;
  goto = function(screen) {
    speech.stop();
    if (state.screen === 'checklist' && screen !== 'checklist') cancelDiagnosticSession();
    if ((screen === 'briefing' || screen === 'hangar') && state.screen !== screen) {
      invalidateDiagnostics();
    }
    if (screen === 'debrief') {
      state.ui.scoreAnimated = false;
      state.ui.resultsExpanded = false;
    }
    baseGoto(screen);
    if (screen === 'hangar') {
      speech.say('Flight Director, configure the spacecraft and review the engineering indicators before the launch checks.');
    } else if (screen === 'checklist') {
      speech.say('Mission Control. Pre-launch checklist is ready. Select Run Pre-Launch Diagnostics to begin.');
    } else if (screen === 'flight') {
      speech.say('Flight Director, liftoff complete. Earth orbit checkout is now displayed. Run Phase One to continue.', {scene:'flight-phase-1'});
    } else if (screen === 'debrief') {
      const r = report();
      if (r) speech.say(r.crewSafe
        ? `Flight Director, the simulated crew is safe. Mission score: ${r.score} points. Science data transmitted: ${r.scienceTransmittedMb} megabytes. Welcome home.`
        : `Flight Director, mission review required. The crew did not meet the safety criteria. Review the report and try again.`);
    }
  };

  const baseRender = render;
  render = function() {
    if (diagnostics().status === 'complete' && diagnostics().signature !== shipSignature(state.ship)) {
      invalidateDiagnostics('Configuration changed. Re-run diagnostics to authorize launch.');
    }
    baseRender();
    const shell = document.getElementById('app-shell');
    const visualScene = state.screen === 'briefing' ?
      (state.ui.selectedPhase === 1 ? 'moon' : state.ui.selectedPhase === 2 ? 'earth-return' : 'earth') :

      if(v3.connected)throw new Error('Team engine owns spacecraft state; use refreshFromEngine().');
      const result=priorAPI.setShipSnapshot(partial);
      const e=demoEngine.state.engineering,r=demoEngine.state.resources;
      if(partial.totalMassKg!==undefined)e.totalMassKg=partial.totalMassKg;
      if(partial.powerBalanceWatts!==undefined)e.netPowerWatts=partial.powerBalanceWatts;
      if(partial.batteryChargePercent!==undefined)r.batteryCurrentWh=partial.batteryChargePercent*r.batteryCapacityWh/100;
      if(partial.fuelRemainingDeltaV!==undefined)r.maneuverReserveMps=partial.fuelRemainingDeltaV;
      if(partial.heatShieldInstalled!==undefined)demoEngine.state.safety.heatShieldInstalled=partial.heatShieldInstalled;
      if(partial.antennaActive!==undefined)demoEngine.state.safety.antennaActive=partial.antennaActive;
      syncFromEngine();v3.acknowledged={};invalidateDiagnostics();render();return result;
    },
    setMissionResult(payload){
      if(!v3.completion)throw new Error('Phase 1 must be completed before a final mission result can be accepted.');
      if(!Array.isArray(payload?.history)||payload.history[0]?.phase!==1||payload.history[1]?.phase!==2||payload.history[2]?.phase!==3)
        throw new TypeError('Final result must contain sequential phases 1, 2, and 3.');
      if(payload.history[0]?.fuelSpentDeltaV!==v3.completion.departureReceipt.usedDeltaVMps)
        throw new Error('Final history does not match the committed Phase 1 departure burn.');
      priorAPI.setMissionResult(payload);
    }
  });
  window.ArtemisNicolasPhase1=Object.freeze({
    connectEngine(engine){
      if(v3.completion)throw new Error('Cannot replace the engine in the middle of a completed campaign.');
      for(const method of ['getState','evaluatePhase1','previewDepartureBurn','recordChecklistApproval','commitDepartureBurn','completePhase1'])
        if(typeof engine?.[method]!=='function')throw new TypeError(`Team engine is missing ${method}().`);
      const prev=v3.engine;v3.engine=engine;v3.connected=true;
      try{syncFromEngine();}catch(e){v3.engine=prev;v3.connected=false;syncFromEngine();throw e;}
      v3.acknowledged={};v3.error=null;invalidateDiagnostics();render();
      return this.getMissionState();
    },
    refreshFromEngine(){syncFromEngine();v3.acknowledged={};invalidateDiagnostics('Team engineering state updated; a fresh diagnostic scan is required.');render();return this.getMissionState();},
    getMissionState(){return clone(v3.official);},
    getPhase1Handoff(){return v3.completion?clone(v3.completion):null;},
    getGuidedBurnPreview(deltaV=v3.previewBurnMps){if(v3.departureActionId)throw new Error('Departure burn already committed.');return clone(v3.engine.previewDepartureBurn({requestedDeltaVMps:deltaV}));},
    openPhase1(){goto('briefing');},
    getStatus(){return {connected:v3.connected,step:state.screen,phase1Complete:!!v3.completion,
      diagnosticStatus:diagnostics().status,burnStatus:v3.burnStatus,
      risksAcknowledged:phase1WarningsAcknowledged(),gates:clone(phase1Gates())};}
  });
  syncFromEngine();
  render();

})();

</script></body></html>
